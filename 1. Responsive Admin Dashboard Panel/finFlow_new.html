<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--========= CSS  ================-->
    <link rel="stylesheet" href="./finFlow_new.css" />
    <title>FinFlow</title>
  </head>
  <body>
    <nav>
      <!-- Logo -->
      <div class="logo-name">
        <div class="logo-image">
          <!-- SVG placeholder for logo -->
          <!-- Red square with FF letters -->
          FF
        </div>
        <span class="logo_name">FinFlow</span>
      </div>

      <!-- Menu Items -->
      <div class="menu-items">
        <ul class="nav-links">
          <li>
            <a href="#" class="active">
              <!-- SVG placeholder for Dashboard icon -->
              <!-- Four small squares icon -->
              <span class="link-name">Dashboard</span>
            </a>
          </li>
          <li>
            <a href="#">
              <!-- SVG placeholder for Inbox icon -->
              <!-- Envelope icon -->
              <span class="link-name">Inbox</span>
              <span class="notification">2</span>
            </a>
          </li>
          <li>
            <a href="#">
              <!-- SVG placeholder for Analytics icon -->
              <!-- Pie chart icon -->
              <span class="link-name">Analytics</span>
            </a>
          </li>
          <li>
            <a href="#">
              <!-- SVG placeholder for Contacts icon -->
              <!-- Two person silhouettes icon -->
              <span class="link-name">Contacts</span>
            </a>
          </li>
          <li>
            <a href="#">
              <!-- SVG placeholder for Projects icon -->
              <!-- Folder icon -->
              <span class="link-name">Projects</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Integration : third party platforms-->
      <div class="third-party-platforms">
        <span>Integrations</span>
        <ul class="third-party-platforms-nav-links">
          <li>
            <a href="#">
              <!-- SVG placeholder for Google ID logo -->
              <!-- Google G logo -->
              <span>Google ID</span>
            </a>
          </li>
          <li>
            <a href="#">
              <!-- SVG placeholder for Evernote logo -->
              <!-- Evernote elephant logo -->
              <span>Evernote</span>
            </a>
          </li>
          <li>
            <a href="#">
              <!-- SVG placeholder for Slack logo -->
              <!-- Slack four-color icon -->
              <span>Slack</span>
            </a>
          </li>
          <li class="button">
            <!-- SVG placeholder for plus icon -->
            <!-- Plus/add icon -->
            <span>Add new</span>
          </li>
        </ul>
      </div>

      <!-- Profile -->
      <div class="profile">
        <div class="profile-image">
          <img src="./finFlowAssets/Susan_Kim_CEO.png" alt="Susan Kim" />
        </div>
        <div>
          <span class="profile-name">Susan Kim</span>
          <span class="profile-designation">CEO</span>
        </div>
      </div>

      <!-- logout-settings-mode -->
      <ul class="logout-settings-mode">
        <li>
          <a href="#">
            <!-- SVG placeholder for Settings icon -->
            <!-- Gear/settings icon -->
            <span class="link-name">Settings</span>
          </a>
        </li>
        <li>
          <a href="#">
            <!-- SVG placeholder for Log out icon -->
            <!-- Door/logout icon -->
            <span class="link-name">Log out</span>
          </a>
        </li>
      </ul>
    </nav>
    <section class="dashboard"></section>
  </body>
</html>
