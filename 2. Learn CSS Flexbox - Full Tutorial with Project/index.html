<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Flexbox</title>
  <link rel="stylesheet" href="style.css" />

        </li>

    <menu>
      <figure>
        <div><img src="./assets/arch1.jpg" alt="" /></div>

          <li>
            <img src="./assets/arch2.jpg" alt="" />
          </li>
          <li>
            <img src="./assets/arch2.jpg" alt="" />

          <li>
            <img src="./assets/arch3.jpg" alt="" />
          </li>
        </ul>
        <figcaption>
          <p>Architecture</p>
          <span>

      <figure>

          <li>

          <li>

          <li>
            <img src="./assets/nature4.jpg" alt="" />

          <li>
            <img src="./assets/aqua2.jpg" alt="" />

          <li>
            <img src="./assets/aqua3.jpg" alt="" />

          <li>
            <img src="./assets/aqua4.jpg" alt="" />

          <span>
